[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwnorm"
version = "1.0.0"
description = "Underwater video exposure / white-balance temporal normalizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "av>=12,<18",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
dev = ["pytest>=7.4", "pytest-timeout>=2.1"]

[project.scripts]
uwnorm = "uwnorm.cli:main"

[tool.setuptools.packages.find]
include = ["uwnorm*"]

[tool.setuptools.package-data]
uwnorm = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
